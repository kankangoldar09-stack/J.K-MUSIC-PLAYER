<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saanp Seedi</title>
    <link rel="stylesheet" href="snakes.css">
</head>

<body>
    <div class="app-bg"></div>

    <!-- HOME MENU SCREEN FOR SNAKES -->
    <div id="home-screen" class="screen active">
        <div class="logo-container small">
            <h1 class="logo-title">SAANP<span>SEEDI</span></h1>
            <p>10x10 Classic Edition</p>
        </div>

        <div class="menu-container">
            <button class="menu-btn btn-vs-comp" onclick="openPlayerSelect('computer')">
                <span class="icon">🤖</span> PLAY VS COMPUTER
            </button>
            <button class="menu-btn btn-pass-play" onclick="openPlayerSelect('passplay')">
                <span class="icon">👥</span> PASS N PLAY
            </button>
            <button class="menu-btn btn-back" onclick="window.location.href='index.html'">
                <span class="icon">🔙</span> BACK TO LUDO
            </button>
        </div>

        <!-- Player Select Modal -->
        <div id="player-modal" class="modal">
            <div class="modal-content">
                <h2>Select Players</h2>
                <div class="player-count-options">
                    <button class="count-btn" onclick="startGame(2)">2</button>
                    <button class="count-btn" onclick="startGame(3)">3</button>
                    <button class="count-btn" onclick="startGame(4)">4</button>
                </div>
                <button class="btn-close" onclick="closePlayerSelect()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- GAME APP CONTAINER -->
    <div id="game-screen" class="screen app-container">

        <button class="btn-top-back" onclick="location.reload()">⤺</button>

        <!-- Player edge tabs based on the image -->
        <!-- Yellow: Middle Left -->
        <div class="player-tab tab-left bg-yellow" id="panel-0">
            <div class="dice-slot" id="dice-slot-0"></div>
        </div>
        <!-- Blue: Middle Right -->
        <div class="player-tab tab-right bg-blue" id="panel-1">
            <div class="dice-slot" id="dice-slot-1"></div>
        </div>
        <!-- Green: Bottom Left -->
        <div class="player-tab tab-bottom bg-green tab-bottom-left" id="panel-3">
            <div class="dice-slot" id="dice-slot-3">
                <div class="dice-wrapper" id="dice-wrapper">
                    <div class="dice" id="dice">
                        <div class="face front"><span class="dot" style="background: red;"></span></div>
                        <div class="face back">
                            <span class="dot"></span><span class="dot"></span>
                            <span class="dot"></span><span class="dot"></span>
                            <span class="dot"></span><span class="dot"></span>
                        </div>
                        <div class="face right">
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        </div>
                        <div class="face left">
                            <span class="dot"></span><span class="dot"></span>
                            <span class="dot"></span><span class="dot"></span>
                        </div>
                        <div class="face top">
                            <span class="dot"></span><span class="dot"></span>
                        </div>
                        <div class="face bottom">
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            <span class="dot"></span><span class="dot"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Red: Bottom Right -->
        <div class="player-tab tab-bottom bg-red tab-bottom-right" id="panel-2">
            <div class="dice-slot" id="dice-slot-2"></div>
        </div>

        <!-- Board Area -->
        <div class="board-container">
            <div class="board-wrapper">
                <div class="board-grid" id="board">
                    <!-- 100 cells generated by JS -->
                </div>
                <!-- SVG layer for Snake and Ladder graphics -->
                <svg class="board-overlay" id="overlay" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"
                    preserveAspectRatio="none">
                    <!-- Snakes and ladders drawn dynamically -->
                </svg>
            </div>
        </div>

    </div>

    <!-- Win Screen Modal -->
    <div id="win-screen" class="screen modal" style="background: rgba(0,0,0,0.9)">
        <div class="modal-content" style="background: transparent; box-shadow: none;">
            <h1 style="color: gold; text-shadow: 0 4px 10px rgba(255,215,0,0.5); font-size: 3rem; margin-bottom: 2rem;"
                id="win-title">WON!</h1>
            <button class="menu-btn btn-vs-comp" onclick="location.reload()">MAIN MENU</button>
        </div>
    </div>

    <div id="toast" class="toast">Tap dice to roll!</div>

    <script src="snakes.js"></script>
</body>

</html>
